<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sam Jakeman - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="galaxy-background.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #000000;
            color: #fff;
            overflow: hidden;
            position: relative;
            height: 100vh;
        }

        /* Starry Sky Background with atmospheric blue */
        .starry-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(15, 20, 35, 0.4) 0%, transparent 40%),
                radial-gradient(ellipse at 70% 80%, rgba(10, 15, 25, 0.3) 0%, transparent 35%),
                #000000;
        }

        /* Milky Way Layer with Rotation - Realistic Colors with Blue Hues */
        .milky-way {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: 1;
            pointer-events: none;
            background: 
                radial-gradient(ellipse 180% 60% at 50% 50%, rgba(220, 215, 200, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 160% 55% at 48% 51%, rgba(200, 195, 180, 0.07) 0%, transparent 48%),
                radial-gradient(ellipse 140% 50% at 52% 49%, rgba(180, 175, 160, 0.06) 0%, transparent 45%),
                radial-gradient(ellipse 120% 45% at 49% 52%, rgba(160, 155, 145, 0.055) 0%, transparent 43%),
                radial-gradient(ellipse 100% 40% at 51% 48%, rgba(140, 135, 130, 0.05) 0%, transparent 40%),
                radial-gradient(ellipse 90% 35% at 46% 50%, rgba(100, 140, 180, 0.045) 0%, transparent 38%),
                radial-gradient(ellipse 80% 30% at 54% 50%, rgba(120, 160, 200, 0.04) 0%, transparent 35%),
                radial-gradient(ellipse at 35% 55%, rgba(90, 110, 150, 0.035) 0%, transparent 30%),
                radial-gradient(ellipse at 65% 45%, rgba(110, 130, 170, 0.03) 0%, transparent 28%),
                radial-gradient(ellipse at 42% 58%, rgba(80, 60, 100, 0.025) 0%, transparent 25%),
                radial-gradient(ellipse at 58% 42%, rgba(70, 90, 120, 0.022) 0%, transparent 23%);
            animation: rotateSky 240s linear infinite;
            transform-origin: center center;
        }

        @keyframes rotateSky {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Mountains Layer - 8K Quality */
        .mountains {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40vh;
            z-index: 5;
            pointer-events: none;
        }

        .mountain-layer-1 {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 600" preserveAspectRatio="none"><path d="M0,600 L0,400 L80,420 L140,380 L180,410 L240,360 L280,340 L320,300 L360,280 L420,250 L480,270 L540,240 L600,200 L680,180 L760,220 L840,190 L920,160 L1000,140 L1080,120 L1160,80 L1220,60 L1280,100 L1360,130 L1440,150 L1520,180 L1600,210 L1680,240 L1740,270 L1800,300 L1860,330 L1920,360 L2000,400 L2080,430 L2160,460 L2240,490 L2320,520 L2400,550 L2400,600 Z" fill="%23000000"/></svg>');
            background-position: bottom;
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }

        .mountain-layer-2 {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 450" preserveAspectRatio="none"><path d="M0,450 L0,320 L100,310 L180,290 L260,270 L340,250 L420,230 L500,200 L580,170 L660,140 L740,110 L820,80 L900,60 L980,50 L1060,70 L1140,90 L1220,110 L1300,130 L1380,160 L1460,190 L1540,220 L1620,250 L1700,280 L1780,310 L1860,340 L1940,370 L2020,400 L2100,420 L2180,430 L2260,440 L2340,445 L2400,448 L2400,450 Z" fill="%23020202"/></svg>');
            background-position: bottom;
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }

        .mountain-layer-3 {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 300" preserveAspectRatio="none"><path d="M0,300 L0,220 L120,210 L240,190 L360,160 L480,130 L600,100 L720,70 L840,50 L960,40 L1080,60 L1200,80 L1320,110 L1440,140 L1560,170 L1680,200 L1800,230 L1920,250 L2040,260 L2160,270 L2280,280 L2400,290 L2400,300 Z" fill="%23000000"/></svg>');
            background-position: bottom;
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }

        /* Main content container */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            padding: 60px;
            padding-left: 80px;
        }

        /* Burger Menu - Overhauled */
        .burger-menu {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            cursor: pointer;
            width: 60px;
            height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            transition: all 0.1s ease;
        }

        .burger-menu:hover {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        .burger-line {
            width: 30px;
            height: 3px;
            background: white;
            border-radius: 3px;
            transition: all 0.1s ease;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        .burger-menu.active {
            background: rgba(0, 0, 0, 0.6);
        }

        .burger-menu.active .burger-line:nth-child(1) {
            transform: translateY(11px) rotate(45deg);
        }

        .burger-menu.active .burger-line:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }

        .burger-menu.active .burger-line:nth-child(3) {
            transform: translateY(-11px) rotate(-45deg);
        }

        /* Menu Overlay - Instant */
        .menu-overlay {
            position: fixed;
            top: 0;
            right: -100%;
            width: 380px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            z-index: 9999;
            transition: right 0.15s ease-out;
            padding: 120px 40px 40px;
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
        }

        .menu-overlay.active {
            right: 0;
        }

        .menu-overlay nav {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-overlay a {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: 600;
            padding: 18px 24px;
            border-radius: 12px;
            transition: all 0.1s ease;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: left;
            display: block;
        }

        .menu-overlay a:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateX(-5px);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
        }

        /* Menu close area */
        .menu-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        .menu-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Big Chunky Text */
        .hero-text {
            font-family: 'Poppins', sans-serif;
            text-align: left;
            line-height: 0.85;
            user-select: none;
        }

        .hero-text .line1 {
            font-size: clamp(60px, 11vw, 150px);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 
                0 0 5px rgba(88, 28, 135, 0.2),
                2px 2px 0px rgba(88, 28, 135, 0.15);
            letter-spacing: -4px;
            display: block;
            margin-bottom: -12px;
            text-transform: uppercase;
        }

        .hero-text .line2 {
            font-size: clamp(85px, 16vw, 230px);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 
                0 0 8px rgba(255, 255, 255, 0.3),
                0 0 15px rgba(99, 102, 241, 0.2),
                3px 3px 0px rgba(88, 28, 135, 0.2);
            letter-spacing: -6px;
            display: block;
            margin-bottom: -15px;
            text-transform: uppercase;
        }

        .hero-text .line3 {
            font-size: clamp(60px, 11vw, 150px);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 
                0 0 5px rgba(88, 28, 135, 0.2),
                2px 2px 0px rgba(88, 28, 135, 0.15);
            letter-spacing: -4px;
            display: block;
            text-transform: uppercase;
        }

        /* Floating animation */
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .hero-text {
            animation: float 6s ease-in-out infinite;
        }

        /* Featured Tool Button */
        .featured-button {
            position: fixed;
            left: 40px;
            bottom: 100px;
            z-index: 100;
        }

        .featured-button a {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 28px;
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(10px);
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
        }

        .featured-button a:hover {
            transform: translateY(-3px);
            background: rgba(40, 40, 40, 0.7);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .featured-button svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        /* Social Media Footer */
        .social-footer {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-3px);
        }

        .social-link svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .burger-menu {
                top: 15px;
                right: 15px;
                width: 55px;
                height: 55px;
            }

            .menu-overlay {
                width: 100%;
                right: -100%;
                padding: 100px 30px 30px;
            }

            .menu-overlay.active {
                right: 0;
            }

            .container {
                padding: 30px;
                padding-left: 30px;
            }

            .hero-text .line1,
            .hero-text .line3 {
                font-size: clamp(50px, 12vw, 100px);
                letter-spacing: -3px;
            }

            .hero-text .line2 {
                font-size: clamp(70px, 18vw, 140px);
                letter-spacing: -5px;
            }

            .featured-button {
                left: 50%;
                transform: translateX(-50%);
                bottom: 110px;
                width: calc(100% - 40px);
                max-width: 400px;
            }

            .featured-button a {
                font-size: 20px;
                padding: 20px 32px;
                gap: 14px;
                width: 100%;
                justify-content: center;
            }

            .featured-button svg {
                width: 28px;
                height: 28px;
            }

            .social-footer {
                bottom: 20px;
                gap: 20px;
            }
            
            .social-link {
                width: 50px;
                height: 50px;
            }
            
            .social-link svg {
                width: 26px;
                height: 26px;
            }
        }
    </style>
</head>

    <!-- Menu Toggle Script -->
    <script>
        const burgerMenu = document.getElementById('burgerMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        const menuBackdrop = document.getElementById('menuBackdrop');

        function openMenu() {
            burgerMenu.classList.add('active');
            menuOverlay.classList.add('active');
            menuBackdrop.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeMenu() {
            burgerMenu.classList.remove('active');
            menuOverlay.classList.remove('active');
            menuBackdrop.classList.remove('active');
            document.body.style.overflow = '';
        }

        burgerMenu.addEventListener('click', (e) => {
            e.stopPropagation();
            if (menuOverlay.classList.contains('active')) {
                closeMenu();
            } else {
                openMenu();
            }
        });

        // Close menu when clicking backdrop
        menuBackdrop.addEventListener('click', closeMenu);

        // Close menu on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && menuOverlay.classList.contains('active')) {
                closeMenu();
            }
        });
    </script>
