    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .hero {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 80px 16px 120px;
        }

        .hero-panel {
            width: min(980px, 100%);
            border-radius: 20px;
            background: rgba(10, 17, 30, 0.76);
            border: 1px solid rgba(137, 180, 255, 0.3);
            box-shadow: 0 22px 48px rgba(0, 0, 0, 0.32);
            padding: 32px;
        }

        .hero-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(96, 165, 250, 0.14);
            border: 1px solid rgba(137, 180, 255, 0.34);
            color: #c9e0ff;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        h1 {
            font-size: clamp(44px, 10vw, 100px);
            line-height: 0.92;
            letter-spacing: -0.05em;
            color: #eef5ff;
        }

        .subtitle {
            margin-top: 14px;
            max-width: 58ch;
            color: #a9bbd4;
            font-size: clamp(16px, 2.2vw, 20px);
            line-height: 1.55;
        }

        .cta-grid {
            margin-top: 28px;
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            padding: 12px 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.01em;
            border: 1px solid rgba(137, 180, 255, 0.34);
            color: #eaf2ff;
            background: rgba(18, 30, 50, 0.72);
            transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
            text-align: center;
        }

        .cta:hover {
            transform: translateY(-2px);
            border-color: rgba(137, 180, 255, 0.7);
            background: rgba(28, 42, 66, 0.9);
        }

        .cta.primary {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.8), rgba(14, 116, 144, 0.9));
            border-color: rgba(147, 197, 253, 0.66);
        }

        .cta-dropdown {
            position: relative;
        }

        .cta-dropdown > summary {
            list-style: none;
            cursor: pointer;
            user-select: none;
        }

        .cta-dropdown > summary::-webkit-details-marker {
            display: none;
        }

        .cta-dropdown > summary::after {
            content: "▾";
            margin-left: 8px;
            font-size: 13px;
            opacity: 0.9;
        }

        .cta-dropdown[open] > summary::after {
            content: "▴";
        }

        .cta-dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            display: grid;
            gap: 8px;
            padding: 10px;
            border-radius: 12px;
            background: rgba(10, 17, 30, 0.96);
            border: 1px solid rgba(137, 180, 255, 0.32);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.34);
            z-index: 20;
        }

        .cta-subitem {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            color: #eaf2ff;
            border: 1px solid rgba(137, 180, 255, 0.26);
            background: rgba(20, 33, 54, 0.72);
        }

        .cta-subitem:hover {
            background: rgba(29, 46, 71, 0.9);
            border-color: rgba(137, 180, 255, 0.62);
        }

        @media (max-width: 900px) {
            .cta-grid {
                grid-template-columns: 1fr;
            }

            .hero-panel {
                padding: 24px;
            }
        }

        @media (max-width: 520px) {
            .hero {
                padding: 64px 12px 110px;
            }

            .hero-panel {
                border-radius: 16px;
                padding: 20px;
            }

            .cta-dropdown-menu {
                position: static;
                margin-top: 8px;
            }
        }
    </style>
</head>
