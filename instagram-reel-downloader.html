<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Reel Downloader - Sam Jakeman</title>
    <link rel="stylesheet" href="galaxy-background.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #000000;
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        header, .container {
            position: relative;
            z-index: 1;
        }

        .header {
            background: transparent;
            color: white;
            padding: 60px 20px 40px;
            text-align: center;
        }
        .header h1 {
            font-size: clamp(28px, 5vw, 48px);
            margin-bottom: 8px;
            font-weight: 700;
        }
        .header p {
            font-size: clamp(14px, 3vw, 16px);
            opacity: 0.95;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            backdrop-filter: blur(10px);
        }
        .tool-section {
            margin-bottom: 40px;
        }
        label {
            font-weight: 600;
            color: white;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 16px;
        }
        button {
            background: #e1306c;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover {
            background: #405de6;
        }
        .result {
            margin-top: 24px;
            padding: 16px;
            background: rgba(249, 250, 251, 0.5);
            border-radius: 8px;
            color: white;
            backdrop-filter: blur(10px);
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 24px;
            background: #405de6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            text-decoration: none;
        }
        .back-btn:hover {
            background: #e1306c;
        }
    </style>
</head>
<body>
    <div class="starry-background" id="starryBg"></div>
    <header class="header">
        <h1>Instagram Reel Downloader</h1>
        <p>Download Instagram Reels quickly and easily</p>
    </header>
    <div class="container">
        <a href="index.html" class="back-btn">← Back to Home</a>
        <section class="tool-section">
            <label for="reelUrl">Instagram Reel URL:</label>
            <input type="text" id="reelUrl" placeholder="Paste Instagram Reel link here...">
            <button onclick="downloadReel()">Download Reel</button>
            <div class="result" id="result">
                <em>Paste an Instagram Reel URL above and click Download</em>
            </div>
        </section>
    </div>

    <script>
        async function downloadReel() {
            const url = document.getElementById('reelUrl').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!url) {
                resultDiv.innerHTML = '<em style="color: #ff6b6b;">Please enter an Instagram Reel URL</em>';
                return;
            }
            
            if (!url.includes('instagram.com')) {
                resultDiv.innerHTML = '<em style="color: #ff6b6b;">Please enter a valid Instagram URL</em>';
                return;
            }
            
            resultDiv.innerHTML = '<em>Fetching video... This may take 10-15 seconds...</em>';
            
            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url })
                });
                
                // Check if response is JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    console.error('Server returned:', text);
                    throw new Error('Server error - Puppeteer may have crashed. Check if URL is valid.');
                }
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to fetch video');
                }
                
                if (data.videoUrl) {
                    resultDiv.innerHTML = `
                        <p style="color: #51cf66; margin-bottom: 12px;">✓ Video found!</p>
                        <a href="${data.videoUrl}" 
                           download="instagram-reel.mp4" 
                           target="_blank"
                           style="display: inline-block; background: #405de6; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600;">
                           📥 Download Video
                        </a>
                        <p style="margin-top: 12px; font-size: 13px; opacity: 0.8;">Click the button above to download or right-click → Save Link As</p>
                    `;
                } else {
                    throw new Error('Video URL not found');
                }
            } catch (error) {
                resultDiv.innerHTML = `<em style="color: #ff6b6b;">Error: ${error.message}</em>`;
            }
        }
        
        document.getElementById('reelUrl').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                downloadReel();
            }
        });
    </script>
    <script src="galaxy-background.js"></script>
</body>
</html>
