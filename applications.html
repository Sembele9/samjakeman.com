<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applications - Sam Jakeman</title>
    <link rel="stylesheet" href="galaxy-background.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #000000;
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        header, main, footer {
            position: relative;
            z-index: 1;
        }

        .header {
            background: transparent;
            color: white;
            padding: 60px 20px 40px;
            text-align: center;
        }

        .header h1 {
            font-size: clamp(28px, 5vw, 52px);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 16px;
            display: inline-block;
            margin-bottom: 20px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        main {
            padding: 60px 20px;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            padding: 28px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(232, 236, 241, 0.3);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .card-icon {
            font-size: 48px;
            margin-bottom: 16px;
            line-height: 1;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-description {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.6;
            flex-grow: 1;
            margin-bottom: 16px;
        }

        .badge {
            display: inline-block;
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        footer {
            background: transparent;
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(232, 236, 241, 0.3);
            padding: 40px 20px;
            text-align: center;
            color: #ccc;
            margin-top: 60px;
        }

        footer p {
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="starry-background" id="starryBg"></div>
    <header class="header">
        <div class="container">
            <a href="index.html" class="back-link">← Back to Home</a>
            <h1>💻 Applications</h1>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="tools-grid">
                <div class="card">
                    <div class="card-icon">🚀</div>
                    <div class="card-title">Coming Soon</div>
                    <div class="card-description">
                        More tools and applications are in development. Check back soon for exciting updates!
                    </div>
                    <span class="badge">In Development</span>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Sam Jakeman - All Rights Reserved</p>
    </footer>

    <script src="galaxy-background.js"></script>
</body>
</html>
