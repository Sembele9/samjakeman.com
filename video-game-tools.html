<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Game Tools - Sam Jakeman</title>
    <link rel="stylesheet" href="galaxy-background.css">
    <link rel="stylesheet" href="shared-background.css">
    <link rel="stylesheet" href="shared-navigation.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #000000;
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        header, main, footer {
            position: relative;
            z-index: 1;
        }

        .header {
            background: transparent;
            color: white;
            padding: 60px 20px 40px;
            text-align: center;
        }

        .header h1 {
            font-size: clamp(28px, 5vw, 52px);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 16px;
            display: inline-block;
            margin-bottom: 20px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        main {
            padding: 60px 20px;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            padding: 28px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(232, 236, 241, 0.3);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
            border-color: #667eea;
        }

        .card-icon {
            font-size: 48px;
            margin-bottom: 16px;
            line-height: 1;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-description {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            flex-grow: 1;
            margin-bottom: 16px;
        }

        .card-arrow {
            color: #667eea;
            font-weight: 600;
            margin-top: 12px;
            display: inline-block;
        }

        .card.minecraft {
            background: rgba(45, 80, 22, 0.5);
            color: white;
            border: 1px solid rgba(144, 238, 144, 0.3);
            backdrop-filter: blur(10px);
        }

        .card.minecraft .card-description {
            color: rgba(255, 255, 255, 0.9);
        }

        .card.minecraft .card-arrow {
            color: #90ee90;
        }

        .card.minecraft:hover {
            border-color: transparent;
            box-shadow: 0 12px 24px rgba(45, 80, 22, 0.3);
        }

        footer {
            background: transparent;
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(232, 236, 241, 0.3);
            padding: 40px 20px;
            text-align: center;
            color: #ccc;
            margin-top: 60px;
        }

        footer p {
            font-size: 13px;
        }
    </style>
</head>
<body>
    <!-- Galaxy Background -->
    <div class="starry-background" id="starryBg"></div>
    
    <!-- Milky Way Layer -->
    <div class="milky-way"></div>
    
    <!-- Mountains -->
    <div class="mountains">
        <div class="mountain-layer-1"></div>
        <div class="mountain-layer-2"></div>
        <div class="mountain-layer-3"></div>
    </div>

    <!-- Burger Menu Icon -->
    <div class="burger-menu" id="burgerMenu">
        <div class="burger-line"></div>
        <div class="burger-line"></div>
        <div class="burger-line"></div>
    </div>

    <!-- Menu Backdrop -->
    <div class="menu-backdrop" id="menuBackdrop"></div>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <nav>
            <a href="/">Home</a>
            <a href="/video-game-tools.html">Video Game Tools</a>
            <a href="/applications.html">Applications</a>
            <a href="/social-media-tools.html">Social Media Tools</a>
        </nav>
    </div>

    <header class="header">
        <div class="container">
            <h1>🎮 Video Game Tools</h1>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="tools-grid">
                <a href="minecraft-tools.html" class="card minecraft">
                    <div class="card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="48" height="48" style="display: block;">
                            <!-- Top grass -->
                            <rect x="10" y="10" width="80" height="40" fill="#5fb75c"/>
                            <!-- Left side dirt -->
                            <rect x="10" y="50" width="40" height="40" fill="#8a6636"/>
                            <!-- Right side dirt -->
                            <rect x="50" y="50" width="40" height="40" fill="#6b5430"/>
                            <!-- Grass texture -->
                            <rect x="25" y="28" width="6" height="6" fill="#4a9a4f"/>
                            <rect x="70" y="32" width="6" height="6" fill="#4a9a4f"/>
                            <rect x="50" y="23" width="6" height="6" fill="#4a9a4f"/>
                        </svg>
                    </div>
                    <div class="card-title">Minecraft Tools</div>
                    <div class="card-description">
                        A collection of useful tools for Minecraft builders including circle and grid generators.
                    </div>
                    <span class="card-arrow">→ Explore Tools</span>
                </a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Sam Jakeman - All Rights Reserved</p>
    </footer>

    <script src="galaxy-background.js"></script>
    <script src="shared-navigation.js"></script>
</body>
</html>
